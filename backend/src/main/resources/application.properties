spring.application.name=job-tracker-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USER:jobtracker}
spring.datasource.password=${DB_PASSWORD:jobtracker123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 本地开发密钥，生产环境请通过 JWT_SECRET 环境变量覆盖
app.jwt.secret=${JWT_SECRET:dev-only-job-tracker-secret-change-me-0123456789abcdef}
app.jwt.ttl=PT2H
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
